<!DOCTYPE html>

<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dodaj wydarzenie</title>

<link rel="stylesheet" href="style.css">

<script src="https://accounts.google.com/gsi/client" async defer></script>

</head>

<body>

<div id="loginView">

<h1>Dodawanie wydarzenia</h1>

<button id="loginBtn">Zaloguj z Google</button>

</div>

<div id="formView" class="hidden">

<h1>Nowe wydarzenie</h1>

<label for="title">Nazwa wydarzenia</label> <input id="title" type="text">

<label for="location">Lokalizacja</label> <input id="location" type="text">

<h2>Początek</h2>

<label for="day">Dzień</label> <select id="day"></select>

<label for="month">Miesiąc</label> <select id="month"></select>

<label>
<input type="checkbox" id="allDay">
wydarzenie całodniowe
</label>

<div id="timeBlock">

<label for="hour">Godzina</label> <select id="hour"></select>

<label for="minute">Minuta</label> <select id="minute"></select>

</div>

<h2>Czas trwania</h2>

<label for="durDays">Dni</label> <select id="durDays"></select>

<label for="durHours">Godziny</label> <select id="durHours"></select>

<label for="durMinutes">Minuty</label> <select id="durMinutes"></select>

<button id="addBtn">Dodaj wydarzenie</button>

</div>

<dialog id="dialog">

<p>Wydarzenie utworzone</p>

<button id="okBtn">OK</button>

</dialog>

<script src="add.js"></script>

</body>
</html>
